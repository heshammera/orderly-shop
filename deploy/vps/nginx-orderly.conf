limit_req_zone $binary_remote_addr zone=orderly_auth:10m rate=5r/m;
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 404; }
}
server {
    listen 80;
    listen [::]:80;
    server_name orderlyshops.com www.orderlyshops.com;
    client_max_body_size 100m;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    # Serve the Supabase API on the working website hostname too.
    location ~ ^/supabase/(auth|rest|storage|realtime|functions)/v1(?:/|$) {
        rewrite ^/supabase/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
    location /supabase/ { return 404; }
    location ~ ^/api/(auth/(register|send-otp)|admin/login)$ {
        limit_req zone=orderly_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header x-middleware-subrequest "";
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header x-middleware-subrequest "";
        proxy_read_timeout 120s;
    }
}
server {
    listen 80;
    listen [::]:80;
    server_name api.orderlyshops.com;
    client_max_body_size 100m;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location ~ ^/(auth|rest|storage|realtime|functions)/v1(?:/|$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
    location / { return 404; }
}

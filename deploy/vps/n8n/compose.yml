services:
  n8n:
    image: docker.n8n.io/n8nio/n8n@sha256:f98bb7c2e0818412e414d456ab31ef48be2dc5ce5d1e6fae7ae171fbb6923093
    container_name: orderly-n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    env_file: .env
    environment:
      N8N_HOST: n8n.orderlyshops.com
      N8N_PROTOCOL: https
      N8N_PORT: 5678
      N8N_EDITOR_BASE_URL: https://n8n.orderlyshops.com
      WEBHOOK_URL: https://n8n.orderlyshops.com/
      N8N_PROXY_HOPS: 2
      GENERIC_TIMEZONE: Africa/Cairo
      TZ: Africa/Cairo
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "false"
    volumes:
      - n8n_data:/home/node/.n8n
volumes:
  n8n_data:
